<script>
let TOKEN='', ADMIN=null, EXAMS=[], STUDENTS=[];
const $=id=>document.getElementById(id);
const msg=e=>typeof e==='string'?e:(e?.message||'Terjadi kesalahan');

function call(fn,...args){
  return new Promise((ok,no)=>{
    google.script.run
      .withSuccessHandler(ok)
      .withFailureHandler(e=>no(new Error(msg(e))))[fn](...args);
  });
}

function showLogin(text=''){
  $('loginView').hidden=false;
  $('appView').hidden=true;
  $('loginMsg').textContent=text;
}

function startApp(){
  $('loginView').hidden=true;
  $('appView').hidden=false;
  $('adminName').textContent=ADMIN?.Nama||'Guru';
  page('dashboard');
}

/* LOGIN */
$('loginForm').onsubmit=async e=>{
  e.preventDefault();
  const f=new FormData(e.target);
  const email=f.get('email'), password=f.get('password');

  try{
    $('loginMsg').textContent='Memproses...';

    const r=await call('loginAdmin',email,password);

    if(!r?.token||!r?.admin) throw new Error('Login gagal');

    TOKEN=r.token;
    ADMIN=r.admin;

    sessionStorage.setItem('ugas_token',TOKEN);
    sessionStorage.setItem('ugas_admin',JSON.stringify(ADMIN));

    startApp();

  }catch(err){
    TOKEN='';
    ADMIN=null;
    showLogin(msg(err));
  }
};

/* LOGOUT */
async function logout(){
  try{ await call('logoutAdmin',TOKEN); }catch(e){}
  sessionStorage.clear();
  showLogin();
}

/* MENU */
function page(id){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  $(id).classList.add('active');

  if(id==='dashboard') dashboard();
  if(id==='questions') questions();
  if(id==='invite') invite();
  if(id==='results') results();
}

/* DASHBOARD */
async function dashboard(){
  try{
    const d=await call('getDashboard',TOKEN);
    $('studentsCount').textContent=d.students||0;
    $('examsCount').textContent=d.exams||0;
    $('questionsCount').textContent=d.questions||0;
    $('resultsCount').textContent=d.results||0;
  }catch(e){ showLogin(msg(e)); }
}

/* TAMBAH SISWA */
$('studentForm').onsubmit=async e=>{
  e.preventDefault();
  try{
    await call('addStudent',TOKEN,
      Object.fromEntries(new FormData(e.target)));
    alert('Siswa berhasil ditambahkan');
    e.target.reset();
    dashboard();
  }catch(err){alert(msg(err));}
};

/* BUAT UJIAN */
$('examForm').onsubmit=async e=>{
  e.preventDefault();
  try{
    await call('createExam',TOKEN,
      Object.fromEntries(new FormData(e.target)));
    alert('Ujian berhasil dibuat');
    e.target.reset();
  }catch(err){alert(msg(err));}
};

async function loadExams(){
  EXAMS=await call('getExams',TOKEN);
}

function examOptions(text){
  return `<option value="">${text}</option>`+
    EXAMS.map(x=>`<option value="${x.ExamID}">${x.NamaUjian}</option>`).join('');
}

/* SOAL */
async function questions(){
  try{
    await loadExams();
    $('questionExamFilter').innerHTML=examOptions('Semua ujian');
    $('questionExam').innerHTML=examOptions('Pilih ujian');
    loadQuestions();
  }catch(e){alert(msg(e));}
}

async function loadQuestions(){
  try{
    const data=await call('getQuestions',TOKEN,$('questionExamFilter').value);

    $('questionList').innerHTML=data.length
      ?data.map(q=>`
        <div class="item">
          <b>${q.Pertanyaan}</b><br>
          A. ${q.PilihanA}<br>
          B. ${q.PilihanB}<br>
          C. ${q.PilihanC}<br>
          D. ${q.PilihanD}<br>
          Jawaban: <b>${q.JawabanBenar}</b>
          <button onclick="removeQuestion('${q.QuestionID}')">🗑️ Hapus</button>
        </div>`).join('')
      :'<div class="item">Belum ada soal.</div>';

  }catch(e){alert(msg(e));}
}

function newQuestion(){
  $('questionForm').reset();
  $('questionEditor').hidden=false;
}

function closeQuestion(){
  $('questionEditor').hidden=true;
}

$('questionForm').onsubmit=async e=>{
  e.preventDefault();

  try{
    const d=Object.fromEntries(new FormData(e.target));

    if(d.QuestionID)
      await call('updateQuestion',TOKEN,d.QuestionID,d);
    else
      await call('addQuestion',TOKEN,d);

    alert('Soal berhasil disimpan');
    closeQuestion();
    loadQuestions();

  }catch(err){alert(msg(err));}
};

async function removeQuestion(id){
  if(!confirm('Hapus soal?'))return;

  try{
    await call('deleteQuestion',TOKEN,id);
    loadQuestions();
  }catch(e){alert(msg(e));}
}

/* UNDANGAN */
async function invite(){
  try{
    await loadExams();
    STUDENTS=await call('getStudents',TOKEN);

    $('inviteExam').innerHTML=examOptions('Pilih ujian');

    $('inviteStudents').innerHTML=STUDENTS.map(s=>`
      <label class="student-item">
        <input type="checkbox" value="${s.StudentID}">
        ${s.Nama} - ${s.Kelas}
      </label>`).join('');

  }catch(e){alert(msg(e));}
}

function selectAllStudents(v){
  document.querySelectorAll('#inviteStudents input')
    .forEach(x=>x.checked=v);
}

async function sendInvitations(){
  const exam=$('inviteExam').value;
  const ids=[...document.querySelectorAll('#inviteStudents input:checked')]
    .map(x=>x.value);

  if(!exam)return alert('Pilih ujian');
  if(!ids.length)return alert('Pilih siswa');

  try{
    const r=await call('sendInvitation',TOKEN,exam,ids);
    alert(`Berhasil: ${r.total} siswa`);
  }catch(e){alert(msg(e));}
}

/* NILAI */
async function results(){
  try{
    await loadExams();
    $('resultExam').innerHTML=examOptions('Semua ujian');
    loadResults();
  }catch(e){alert(msg(e));}
}

async function loadResults(){
  try{
    const data=await call('getResults',TOKEN,$('resultExam').value);

    $('resultTable').innerHTML=data.length
      ?'<table>'+data.map(x=>`
        <tr>
          <td>${x.Nama}</td>
          <td>${x.Kelas}</td>
          <td>${x.Nilai}</td>
          <td>${x.Status}</td>
        </tr>`).join('')+'</table>'
      :'<div class="item">Belum ada nilai.</div>';

  }catch(e){alert(msg(e));}
}

/* RESTORE SESSION */
(async()=>{
  try{
    TOKEN=sessionStorage.getItem('ugas_token')||'';
    ADMIN=JSON.parse(sessionStorage.getItem('ugas_admin')||'null');

    if(TOKEN&&ADMIN){
      await call('getDashboard',TOKEN);
      startApp();
    }else{
      showLogin();
    }
  }catch(e){
    sessionStorage.clear();
    showLogin();
  }
})();
               </script>
