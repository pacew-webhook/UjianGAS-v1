<script>
let TOKEN = '', ADMIN = null;
let EXAMS = [], STUDENTS = [], QUESTIONS = [], RESULTS = [], ADMINS = [];
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
const msg = e => e?.message || String(e || 'Terjadi kesalahan');

function call(fn, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(e => reject(new Error(msg(e))))[fn](...args);
  });
}

function busy(on) { $('loading').hidden = !on; }
function toast(text) { $('toast').textContent = text; $('toast').hidden = false; clearTimeout(window.__toast); window.__toast = setTimeout(() => $('toast').hidden = true, 2600); }
function showLogin(text='') { $('loginView').hidden = false; $('appView').hidden = true; $('loginMsg').textContent = text; }
function showApp() { $('loginView').hidden = true; $('appView').hidden = false; $('adminName').textContent = ADMIN?.Nama || 'Guru'; $('adminRole').textContent = ADMIN?.Role || 'ADMIN'; }

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  try {
    busy(true); $('loginMsg').textContent = '';
    const r = await call('loginAdmin', f.get('email'), f.get('password'));
    if (!r?.token) throw new Error('Login gagal.');
    TOKEN = r.token; ADMIN = r.admin;
    localStorage.setItem('ugas_token', TOKEN);
    localStorage.setItem('ugas_admin', JSON.stringify(ADMIN));
    showApp(); page('dashboard');
  } catch (e) { $('loginMsg').textContent = msg(e); }
  finally { busy(false); }
});

async function logout() {
  try { await call('logoutAdmin', TOKEN); } catch(e) {}
  TOKEN=''; ADMIN=null; localStorage.removeItem('ugas_token'); localStorage.removeItem('ugas_admin'); showLogin();
}

function page(id) {
  document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.sidebar button').forEach(x => x.classList.toggle('active', x.dataset.page === id));
  $(id).classList.add('active');
  const loaders = {dashboard,students:loadStudents,exams:loadExams,questions:questions,invite:invite,results:results,reminders:loadReminders,admins:loadAdmins};
  if (loaders[id]) loaders[id]();
  window.scrollTo({top:0,behavior:'smooth'});
}

async function dashboard() {
  try {
    const d = await call('getDashboard', TOKEN);
    $('studentsCount').textContent=d.students||0; $('examsCount').textContent=d.exams||0; $('questionsCount').textContent=d.questions||0; $('resultsCount').textContent=d.results||0;
    $('activeStudents').textContent=(d.activeStudents||0)+' aktif'; $('publishedExams').textContent=(d.publishedExams||0)+' published';
  } catch(e) { if(/Sesi/.test(msg(e))) { localStorage.removeItem('ugas_token'); localStorage.removeItem('ugas_admin'); showLogin(msg(e)); } }
}

/* STUDENTS */
async function loadStudents() { try { STUDENTS=await call('getStudents',TOKEN); renderStudents(); } catch(e){ toast(msg(e)); } }
function renderStudents() {
  const q=($('studentSearch')?.value||'').toLowerCase(); const st=$('studentStatusFilter')?.value||'';
  const data=STUDENTS.filter(s => (!st||String(s.Status).toUpperCase()===st) && [s.Nama,s.Email,s.Kelas].join(' ').toLowerCase().includes(q));
  $('studentsTable').innerHTML = data.length ? `<table><thead><tr><th>Nama</th><th>Email</th><th>Kelas</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${data.map(s=>`<tr><td><b>${esc(s.Nama)}</b></td><td>${esc(s.Email||'-')}</td><td>${esc(s.Kelas||'-')}</td><td>${statusBadge(s.Status)}</td><td class="actions"><button class="small-btn" onclick="openStudentModal('${esc(s.StudentID)}')">Edit</button><button class="danger-btn" onclick="removeStudent('${esc(s.StudentID)}')">Hapus</button></td></tr>`).join('')}</tbody></table>` : empty('Belum ada data siswa.');
}
function openStudentModal(id='') {
  const s=STUDENTS.find(x=>String(x.StudentID)===String(id))||{};
  openModal(`<h2 class="modal-title">${id?'Edit Siswa':'Tambah Siswa'}</h2><form id="studentForm" class="modal-form"><div class="form-grid"><label>Nama<input name="Nama" value="${esc(s.Nama||'')}" required></label><label>Email<input type="email" name="Email" value="${esc(s.Email||'')}"></label><label>Kelas<input name="Kelas" value="${esc(s.Kelas||'')}" placeholder="Contoh: XII IPA 1"></label><label>Status<select name="Status"><option ${String(s.Status||'ACTIVE').toUpperCase()==='ACTIVE'?'selected':''}>ACTIVE</option><option ${String(s.Status||'').toUpperCase()==='INACTIVE'?'selected':''}>INACTIVE</option></select></label></div><label>Password ${id?'<span class="hint">Kosongkan jika tidak diubah.</span>':''}<input type="password" name="Password" autocomplete="new-password"></label><div class="modal-actions"><button type="button" class="ghost" onclick="closeModal()">Batal</button><button class="primary">Simpan</button></div></form>`);
  $('studentForm').onsubmit=async e=>{e.preventDefault();try{busy(true);const d=Object.fromEntries(new FormData(e.target));if(id)await call('updateStudent',TOKEN,id,d);else await call('addStudent',TOKEN,d);closeModal();toast('Data siswa tersimpan.');await loadStudents();await dashboard();}catch(err){toast(msg(err));}finally{busy(false);}};
}
async function removeStudent(id){if(!confirm('Hapus siswa ini?'))return;try{busy(true);await call('deleteStudent',TOKEN,id);toast('Siswa dihapus.');await loadStudents();await dashboard();}catch(e){toast(msg(e));}finally{busy(false);}}

/* EXAMS */
async function loadExams(){try{EXAMS=await call('getExams',TOKEN);renderExams();fillExamSelects();}catch(e){toast(msg(e));}}
function renderExams(){const q=($('examSearch')?.value||'').toLowerCase(),st=$('examStatusFilter')?.value||'';const data=EXAMS.filter(x=>(!st||String(x.Status).toUpperCase()===st)&&[x.NamaUjian,x.Mapel].join(' ').toLowerCase().includes(q));$('examsList').innerHTML=data.length?data.map(e=>`<div class="item-card"><div class="item-top"><div><h3>${esc(e.NamaUjian)}</h3><div class="meta">${esc(e.Mapel||'Tanpa mapel')} • ${esc(e.DurasiMenit)} menit</div><div class="meta">📅 ${esc(e.Tanggal)} • ${esc(e.JamMulai)} – ${esc(e.JamSelesai)}</div></div><div>${statusBadge(e.Status)}</div></div><div class="item-actions"><button class="small-btn" onclick="openExamModal('${esc(e.ExamID)}')">Edit</button><button class="small-btn" onclick="page('questions');setTimeout(()=>{if($('questionExamFilter')){$('questionExamFilter').value='${esc(e.ExamID)}';loadQuestions()}},150)">Kelola Soal</button><button class="danger-btn" onclick="removeExam('${esc(e.ExamID)}')">Hapus</button></div></div>`).join(''):empty('Belum ada ujian.');}
function openExamModal(id=''){const e=EXAMS.find(x=>String(x.ExamID)===String(id))||{};openModal(`<h2 class="modal-title">${id?'Edit Ujian':'Buat Ujian'}</h2><form id="examForm" class="modal-form"><label>Nama Ujian<input name="NamaUjian" value="${esc(e.NamaUjian||'')}" required></label><div class="form-grid"><label>Mapel<input name="Mapel" value="${esc(e.Mapel||'')}" placeholder="Matematika"></label><label>Durasi (menit)<input type="number" name="DurasiMenit" min="1" value="${esc(e.DurasiMenit||60)}" required></label><label>Tanggal<input type="date" name="Tanggal" value="${esc(formatDateInput(e.Tanggal))}" required></label><label>Status<select name="Status"><option ${String(e.Status||'DRAFT').toUpperCase()==='DRAFT'?'selected':''}>DRAFT</option><option ${String(e.Status||'').toUpperCase()==='PUBLISHED'?'selected':''}>PUBLISHED</option><option ${String(e.Status||'').toUpperCase()==='CLOSED'?'selected':''}>CLOSED</option></select></label><label>Jam Mulai<input type="time" name="JamMulai" value="${esc(formatTimeInput(e.JamMulai))}" required></label><label>Jam Selesai<input type="time" name="JamSelesai" value="${esc(formatTimeInput(e.JamSelesai))}" required></label></div><div class="modal-actions"><button type="button" class="ghost" onclick="closeModal()">Batal</button><button class="primary">Simpan</button></div></form>`);$('examForm').onsubmit=async ev=>{ev.preventDefault();try{busy(true);const d=Object.fromEntries(new FormData(ev.target));if(id)await call('updateExam',TOKEN,id,d);else await call('createExam',TOKEN,d);closeModal();toast('Ujian tersimpan.');await loadExams();await dashboard();}catch(err){toast(msg(err));}finally{busy(false);}};}
async function removeExam(id){if(!confirm('Hapus ujian ini? Data soal dan hasil yang terkait tidak ikut dihapus otomatis.'))return;try{busy(true);await call('deleteExam',TOKEN,id);toast('Ujian dihapus.');await loadExams();await dashboard();}catch(e){toast(msg(e));}finally{busy(false);}}
function fillExamSelects(){const opts=(all='Semua ujian')=>`<option value="">${all}</option>`+EXAMS.map(e=>`<option value="${esc(e.ExamID)}">${esc(e.NamaUjian)}</option>`).join('');if($('questionExamFilter'))$('questionExamFilter').innerHTML=opts();if($('inviteExam'))$('inviteExam').innerHTML=opts('Pilih ujian');if($('resultExam'))$('resultExam').innerHTML=opts();if($('reminderExamFilter'))$('reminderExamFilter').innerHTML=opts();}

/* QUESTIONS */
async function questions(){try{if(!EXAMS.length)await loadExams();fillExamSelects();await loadQuestions();}catch(e){toast(msg(e));}}
async function loadQuestions(){try{QUESTIONS=await call('getQuestions',TOKEN,$('questionExamFilter')?.value||'');renderQuestions();}catch(e){toast(msg(e));}}
function renderQuestions(){const q=($('questionSearch')?.value||'').toLowerCase();const data=QUESTIONS.filter(x=>String(x.Pertanyaan).toLowerCase().includes(q));$('questionList').innerHTML=data.length?data.map(x=>`<div class="item-card"><div class="item-top"><div><div class="meta">${esc(examName(x.ExamID))} • Bobot ${esc(x.Bobot||1)}</div><div class="question-text">${esc(x.Pertanyaan)}</div></div><span class="status published">${esc(x.JawabanBenar)}</span></div><div class="options"><div class="option ${x.JawabanBenar==='A'?'correct':''}"><b>A.</b> ${esc(x.PilihanA)}</div><div class="option ${x.JawabanBenar==='B'?'correct':''}"><b>B.</b> ${esc(x.PilihanB)}</div><div class="option ${x.JawabanBenar==='C'?'correct':''}"><b>C.</b> ${esc(x.PilihanC)}</div><div class="option ${x.JawabanBenar==='D'?'correct':''}"><b>D.</b> ${esc(x.PilihanD)}</div></div><div class="item-actions"><button class="small-btn" onclick="openQuestionModal('${esc(x.QuestionID)}')">Edit</button><button class="danger-btn" onclick="removeQuestion('${esc(x.QuestionID)}')">Hapus</button></div></div>`).join(''):empty('Belum ada soal untuk filter ini.');}
function openQuestionModal(id=''){const q=QUESTIONS.find(x=>String(x.QuestionID)===String(id))||{};openModal(`<h2 class="modal-title">${id?'Edit Soal':'Tambah Soal'}</h2><form id="questionForm" class="modal-form"><label>Ujian<select name="ExamID" required>${EXAMS.map(e=>`<option value="${esc(e.ExamID)}" ${String(q.ExamID)===String(e.ExamID)?'selected':''}>${esc(e.NamaUjian)}</option>`).join('')}</select></label><label>Pertanyaan<textarea name="Pertanyaan" required>${esc(q.Pertanyaan||'')}</textarea></label><div class="form-grid"><label>Pilihan A<input name="PilihanA" value="${esc(q.PilihanA||'')}" required></label><label>Pilihan B<input name="PilihanB" value="${esc(q.PilihanB||'')}" required></label><label>Pilihan C<input name="PilihanC" value="${esc(q.PilihanC||'')}" required></label><label>Pilihan D<input name="PilihanD" value="${esc(q.PilihanD||'')}" required></label><label>Jawaban Benar<select name="JawabanBenar"><option>A</option><option>B</option><option>C</option><option>D</option></select></label><label>Bobot<input type="number" name="Bobot" min="0.1" step="0.1" value="${esc(q.Bobot||1)}"></label></div><div class="modal-actions"><button type="button" class="ghost" onclick="closeModal()">Batal</button><button class="primary">Simpan</button></div></form>`);if(q.JawabanBenar)$('questionForm').JawabanBenar.value=q.JawabanBenar;$('questionForm').onsubmit=async ev=>{ev.preventDefault();try{busy(true);const d=Object.fromEntries(new FormData(ev.target));if(id)await call('updateQuestion',TOKEN,id,d);else await call('addQuestion',TOKEN,d);closeModal();toast('Soal tersimpan.');await loadQuestions();await dashboard();}catch(err){toast(msg(err));}finally{busy(false);}};}
async function removeQuestion(id){if(!confirm('Hapus soal ini?'))return;try{busy(true);await call('deleteQuestion',TOKEN,id);toast('Soal dihapus.');await loadQuestions();await dashboard();}catch(e){toast(msg(e));}finally{busy(false);}}

/* INVITATIONS */
async function invite(){try{if(!EXAMS.length)await loadExams();if(!STUDENTS.length)await loadStudents();fillExamSelects();renderInviteStudents();await loadInvitations();}catch(e){toast(msg(e));}}
function renderInviteStudents(){const list=$('inviteStudents');list.innerHTML=STUDENTS.length?STUDENTS.map(s=>`<label class="student-item"><input type="checkbox" value="${esc(s.StudentID)}"> <span><b>${esc(s.Nama)}</b><br><small>${esc(s.Kelas||'-')} • ${esc(s.Email||'tanpa email')}</small></span></label>`).join(''):empty('Belum ada siswa.');}
function selectAllStudents(v){document.querySelectorAll('#inviteStudents input[type=checkbox]').forEach(x=>x.checked=v)}
async function sendInvitations(){const exam=$('inviteExam').value,ids=[...document.querySelectorAll('#inviteStudents input:checked')].map(x=>x.value);if(!exam)return toast('Pilih ujian.');if(!ids.length)return toast('Pilih siswa.');try{busy(true);const r=await call('sendInvitation',TOKEN,exam,ids);toast(`Undangan tersimpan: ${r.total||0}, email terkirim: ${r.emailSent||0}`);await loadInvitations();}catch(e){toast(msg(e));}finally{busy(false);}}
async function loadInvitations(){try{const data=await call('getInvitations',TOKEN,$('inviteExam')?.value||'');$('invitationList').innerHTML=data.length?data.slice().reverse().map(i=>`<div class="item-card"><b>${esc(i.NamaSiswa)}</b><div class="meta">${esc(i.NamaUjian)} • ${esc(i.Email||'-')}</div><div style="margin-top:8px">${statusBadge(i.Status)} <button class="danger-btn" style="float:right" onclick="removeInvitation('${esc(i.InviteID)}')">Hapus</button></div></div>`).join(''):empty('Belum ada undangan.');}catch(e){toast(msg(e));}}
async function removeInvitation(id){if(!confirm('Hapus undangan ini?'))return;try{busy(true);await call('deleteInvitation',TOKEN,id);await loadInvitations();toast('Undangan dihapus.');}catch(e){toast(msg(e));}finally{busy(false);}}

/* RESULTS */
async function results(){try{if(!EXAMS.length)await loadExams();fillExamSelects();await loadResults();}catch(e){toast(msg(e));}}
async function loadResults(){try{RESULTS=await call('getResults',TOKEN,$('resultExam')?.value||'');renderResults();}catch(e){toast(msg(e));}}
function renderResults(){const q=($('resultSearch')?.value||'').toLowerCase();const data=RESULTS.filter(x=>[x.Nama,x.Email,x.Kelas,x.NamaUjian].join(' ').toLowerCase().includes(q));$('resultTable').innerHTML=data.length?`<table><thead><tr><th>Siswa</th><th>Ujian</th><th>Benar</th><th>Salah</th><th>Nilai</th><th>Status</th><th>Waktu</th></tr></thead><tbody>${data.map(x=>`<tr><td><b>${esc(x.Nama)}</b><br><span class="meta">${esc(x.Kelas||'')} • ${esc(x.Email||'')}</span></td><td>${esc(x.NamaUjian)}</td><td>${esc(x.Benar||0)}</td><td>${esc(x.Salah||0)}</td><td><b>${esc(x.Nilai||0)}</b></td><td>${statusBadge(x.Status||'SUBMITTED')}</td><td>${esc(formatDateTime(x.Waktu))}</td></tr>`).join('')}</tbody></table>`:empty('Belum ada hasil ujian.');}

/* REMINDERS */
async function loadReminders(){try{if(!EXAMS.length)await loadExams();fillExamSelects();const data=await call('getReminders',TOKEN,$('reminderExamFilter')?.value||'');$('reminderList').innerHTML=data.length?data.slice().reverse().map(r=>`<div class="item-card"><div class="item-top"><div><h3>${esc(r.Pesan)}</h3><div class="meta">${esc(r.NamaUjian)} • Target: ${esc(r.Target||'SEMUA')}</div></div><button class="danger-btn" onclick="removeReminder('${esc(r.ReminderID)}')">Hapus</button></div><div class="meta" style="margin-top:8px">${esc(formatDateTime(r.Waktu))}</div></div>`).join(''):empty('Belum ada pengingat.');}catch(e){toast(msg(e));}}
function openReminderModal(){openModal(`<h2 class="modal-title">Tambah Pengingat</h2><form id="reminderForm" class="modal-form"><label>Ujian<select name="ExamID" required>${EXAMS.map(e=>`<option value="${esc(e.ExamID)}">${esc(e.NamaUjian)}</option>`).join('')}</select></label><label>Pesan<textarea name="Pesan" required placeholder="Contoh: cek soal sebelum ujian dimulai."></textarea></label><div class="form-grid"><label>Target<input name="Target" value="SEMUA"></label><label>Waktu<input type="datetime-local" name="Waktu"></label></div><div class="modal-actions"><button type="button" class="ghost" onclick="closeModal()">Batal</button><button class="primary">Simpan</button></div></form>`);$('reminderForm').onsubmit=async e=>{e.preventDefault();try{busy(true);await call('addReminder',TOKEN,Object.fromEntries(new FormData(e.target)));closeModal();toast('Pengingat tersimpan.');await loadReminders();}catch(err){toast(msg(err));}finally{busy(false);}};}
async function removeReminder(id){if(!confirm('Hapus pengingat?'))return;try{busy(true);await call('deleteReminder',TOKEN,id);await loadReminders();toast('Pengingat dihapus.');}catch(e){toast(msg(e));}finally{busy(false);}}

/* ADMINS */
async function loadAdmins(){try{ADMINS=await call('getAdmins',TOKEN);$('adminTable').innerHTML=ADMINS.length?`<table><thead><tr><th>Nama</th><th>Email</th><th>Role</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${ADMINS.map(a=>`<tr><td><b>${esc(a.Nama)}</b></td><td>${esc(a.Email)}</td><td>${esc(a.Role)}</td><td>${statusBadge(a.Status)}</td><td class="actions"><button class="small-btn" onclick="openAdminModal('${esc(a.AdminID)}')">Edit</button><button class="danger-btn" onclick="removeAdmin('${esc(a.AdminID)}')">Hapus</button></td></tr>`).join('')}</tbody></table>`:empty('Belum ada admin.');}catch(e){toast(msg(e));}}
function openAdminModal(id=''){const a=ADMINS.find(x=>String(x.AdminID)===String(id))||{};openModal(`<h2 class="modal-title">${id?'Edit Admin':'Tambah Admin'}</h2><form id="adminForm" class="modal-form"><div class="form-grid"><label>Nama<input name="Nama" value="${esc(a.Nama||'')}" required></label><label>Email<input type="email" name="Email" value="${esc(a.Email||'')}" required></label><label>Role<select name="Role"><option ${String(a.Role||'GURU')==='GURU'?'selected':''}>GURU</option><option ${String(a.Role||'')==='ADMIN'?'selected':''}>ADMIN</option></select></label><label>Status<select name="Status"><option ${String(a.Status||'ACTIVE')==='ACTIVE'?'selected':''}>ACTIVE</option><option ${String(a.Status||'')==='INACTIVE'?'selected':''}>INACTIVE</option></select></label></div><label>Password <span class="hint">${id?'Kosongkan jika tidak diubah.':'Wajib untuk admin baru.'}</span><input type="password" name="Password" ${id?'':'required'} autocomplete="new-password"></label><div class="modal-actions"><button type="button" class="ghost" onclick="closeModal()">Batal</button><button class="primary">Simpan</button></div></form>`);$('adminForm').onsubmit=async e=>{e.preventDefault();try{busy(true);const d=Object.fromEntries(new FormData(e.target));if(id)await call('updateAdmin',TOKEN,id,d);else await call('addAdmin',TOKEN,d);closeModal();toast('Admin tersimpan.');await loadAdmins();}catch(err){toast(msg(err));}finally{busy(false);}};}
async function removeAdmin(id){if(!confirm('Hapus akun admin ini?'))return;try{busy(true);await call('deleteAdmin',TOKEN,id);await loadAdmins();toast('Admin dihapus.');}catch(e){toast(msg(e));}finally{busy(false);}}

/* MODAL / HELPERS */
function openModal(html){$('modalContent').innerHTML=html;$('modal').hidden=false;document.body.style.overflow='hidden'}
function closeModal(){$('modal').hidden=true;document.body.style.overflow=''}
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
function empty(text){return `<div class="empty">${esc(text)}</div>`}
function statusBadge(v){const s=String(v||'-').toLowerCase().replace(/\s+/g,'-');return `<span class="status ${s}">${esc(v||'-')}</span>`}
function examName(id){return EXAMS.find(e=>String(e.ExamID)===String(id))?.NamaUjian||id||'-'}
function formatDateInput(v){if(!v)return '';const d=new Date(v);if(!isNaN(d.getTime()))return d.toISOString().slice(0,10);return String(v).slice(0,10)}
function formatTimeInput(v){if(!v)return '';const s=String(v);const m=s.match(/(\d{1,2}):(\d{2})/);return m?m[1].padStart(2,'0')+':'+m[2]:s.slice(0,5)}
function formatDateTime(v){if(!v)return '-';const d=new Date(v);return isNaN(d.getTime())?String(v):d.toLocaleString('id-ID')}

function tokenFromHash_() {
  try { const m = String(window.location.hash || '').replace(/^#/, '').match(/(?:^|&)ugas_token=([^&]+)/); return m ? decodeURIComponent(m[1]) : ''; }
  catch (_) { return ''; }
}
function clearTokenHash_() {
  try { if (window.location.hash) history.replaceState(null, document.title, window.location.pathname + window.location.search); }
  catch (_) { try { window.location.hash = ''; } catch (__) {} }
}
async function restoreAdminSession_() {
  TOKEN = tokenFromHash_() || localStorage.getItem('ugas_token') || sessionStorage.getItem('ugas_token') || '';
  try { ADMIN = JSON.parse(localStorage.getItem('ugas_admin') || sessionStorage.getItem('ugas_admin') || 'null'); } catch (_) { ADMIN = null; }
  if (!TOKEN) { showLogin(); return; }
  try { await call('getDashboard', TOKEN); showApp(); page('dashboard'); }
  catch (e) { TOKEN=''; ADMIN=null; localStorage.removeItem('ugas_token'); localStorage.removeItem('ugas_admin'); sessionStorage.removeItem('ugas_token'); sessionStorage.removeItem('ugas_admin'); clearTokenHash_(); showLogin('Sesi tidak valid atau sudah berakhir. Silakan login kembali.'); }
}
restoreAdminSession_();
</script>
