<style>
:root{--bg:#f4f7fb;--panel:#fff;--text:#172033;--muted:#64748b;--line:#e2e8f0;--primary:#2563eb;--primary2:#1d4ed8;--danger:#dc2626;--success:#059669;--warning:#d97706;--shadow:0 12px 30px rgba(15,23,42,.07)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}body{font-size:14px}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;outline:none;color:var(--text)}input:focus,select:focus,textarea:focus{border-color:#93c5fd;box-shadow:0 0 0 3px #2563eb14}textarea{min-height:105px;resize:vertical}label{display:grid;gap:7px;font-weight:700;color:#334155}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--primary)}h1,h2,h3,p{margin-top:0}.page h1{margin-bottom:5px;font-size:28px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}.primary,.ghost,.danger-btn,.small-btn{border-radius:11px;padding:10px 14px;font-weight:750}.primary{background:var(--primary);color:#fff}.primary:hover{background:var(--primary2)}.primary.big{width:100%;padding:13px}.ghost{background:#eef4ff;color:#1d4ed8}.danger-btn{background:#fee2e2;color:#b91c1c}.small-btn{background:#f1f5f9;color:#334155;padding:7px 10px;font-size:12px}.full{width:100%;margin-top:14px}
.login-screen{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 10%,#dbeafe 0,transparent 35%),radial-gradient(circle at 85% 90%,#e0e7ff 0,transparent 35%),var(--bg)}.login-card{width:min(430px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:32px;box-shadow:0 25px 70px rgba(15,23,42,.12)}.login-card .logo{text-align:center;font-size:48px;margin-bottom:4px}.login-card h1{text-align:center;margin-bottom:5px}.login-card>.muted{text-align:center;margin-bottom:25px}.login-card form{display:grid;gap:15px}.form-msg{min-height:22px;margin-top:12px;text-align:center;color:#dc2626;font-weight:650}
.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:10px}.brand-icon{font-size:28px}.brand strong{display:block}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:1px}.top-actions{display:flex;align-items:center;gap:10px}.admin-name{font-weight:700}.badge{background:#ecfdf5;color:#047857;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}
.app-layout{display:flex;min-height:calc(100vh - 68px)}.sidebar{width:225px;background:#fff;border-right:1px solid var(--line);padding:15px;display:flex;flex-direction:column;gap:6px}.sidebar button{width:100%;text-align:left;padding:11px 12px;border-radius:11px;background:transparent;color:#475569;font-weight:700}.sidebar button:hover,.sidebar button.active{background:#eff6ff;color:#1d4ed8}.sidebar button span{margin-left:5px}main{width:100%;max-width:1250px;margin:0 auto;padding:28px}.page{display:none}.page.active{display:block}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.stat-card{background:#fff;border:1px solid #e8edf3;border-radius:18px;padding:18px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow)}.stat-icon{width:45px;height:45px;border-radius:14px;display:grid;place-items:center;background:#eff6ff;font-size:21px}.stat-card span,.stat-card small{display:block;color:var(--muted)}.stat-card b{display:block;font-size:27px;margin:2px 0}.stat-card small{font-size:11px}.dashboard-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}.panel{background:#fff;border:1px solid #e8edf3;border-radius:18px;padding:18px;box-shadow:var(--shadow)}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.panel-head h3{margin:0}.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick-grid button{padding:14px;border-radius:12px;background:#f8fafc;border:1px solid var(--line);text-align:left;font-weight:700;color:#334155}.status-list{display:grid;gap:12px}.status-list div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f1f5f9}.status-list div:last-child{border-bottom:0}.status-list strong{color:var(--success)}
.toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar .search{max-width:450px}.table-wrap{background:#fff;border:1px solid #e8edf3;border-radius:18px;overflow:auto;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #eef2f7;vertical-align:middle}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#64748b;background:#f8fafc}tbody tr:hover{background:#fbfdff}.actions{display:flex;gap:6px;flex-wrap:wrap}.status{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.status.active,.status.published,.status.invited{background:#dcfce7;color:#166534}.status.inactive,.status.closed{background:#fee2e2;color:#991b1b}.status.draft{background:#fef3c7;color:#92400e}
.item-card{background:#fff;border:1px solid #e8edf3;border-radius:18px;padding:17px;margin-bottom:12px;box-shadow:var(--shadow)}.item-top{display:flex;justify-content:space-between;gap:15px}.item-card h3{margin:0 0 5px}.meta{color:var(--muted);font-size:12px}.question-text{font-size:15px;font-weight:700;line-height:1.5;margin:10px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.option{padding:9px 10px;border-radius:10px;background:#f8fafc;border:1px solid #edf2f7}.option.correct{background:#ecfdf5;border-color:#a7f3d0}.item-actions{display:flex;gap:7px;margin-top:13px}
.invite-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.select-row{display:flex;gap:7px;margin:12px 0}.student-item{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid #eef2f7;border-radius:10px;margin-bottom:7px}.student-item input{width:auto}.field{margin-bottom:12px}.empty{padding:30px;text-align:center;color:var(--muted)}.hint{font-size:12px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;padding:20px;overflow:auto}.modal-card{width:min(700px,100%);margin:40px auto;background:#fff;border-radius:20px;padding:24px;position:relative;box-shadow:0 30px 90px rgba(0,0,0,.2)}.modal-close{position:absolute;right:12px;top:10px;background:#f1f5f9;color:#475569;border-radius:10px;width:34px;height:34px;font-size:22px}.modal-title{margin-bottom:18px}.modal-form{display:grid;gap:13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:5px}.check-row{display:flex;gap:8px;align-items:center}.check-row input{width:auto}.toast{position:fixed;right:20px;bottom:20px;z-index:100;background:#172033;color:#fff;padding:12px 15px;border-radius:12px;box-shadow:0 15px 40px rgba(0,0,0,.2);max-width:360px}.loading{position:fixed;inset:0;background:rgba(255,255,255,.65);z-index:90;display:grid;place-items:center;align-content:center;gap:8px;color:#334155;font-weight:800}.spinner{width:30px;height:30px;border:3px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.dashboard-grid,.invite-layout{grid-template-columns:1fr}.sidebar{width:195px}main{padding:20px}.top-actions .badge{display:none}}
@media(max-width:650px){.topbar{padding:0 12px}.admin-name{display:none}.app-layout{display:block}.sidebar{position:fixed;left:0;right:0;bottom:0;width:100%;height:62px;z-index:30;display:flex;flex-direction:row;overflow-x:auto;padding:6px;border-right:0;border-top:1px solid var(--line)}.sidebar button{min-width:82px;text-align:center;padding:7px 5px;font-size:11px}.sidebar button span{display:block;margin:2px 0 0}.page-head{display:block}.page-head>button{margin-top:10px}.cards{gap:9px}.stat-card{padding:12px}.stat-icon{width:38px;height:38px;font-size:18px}.stat-card b{font-size:23px}.dashboard-grid{gap:10px}main{padding:16px;padding-bottom:82px}.toolbar{display:grid}.toolbar .search{max-width:none}.form-grid,.options,.quick-grid{grid-template-columns:1fr}.modal{padding:10px}.modal-card{margin:15px auto;padding:18px}}
</style>
