<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Arial,sans-serif}.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:min(410px,100%);background:#fff;border-radius:24px;padding:30px;box-shadow:0 20px 60px #0002;text-align:center}.logo{font-size:44px}.login-card h1{margin:8px}.login-card p{color:#64748b}
form{display:grid;gap:12px;text-align:left}input,textarea,select{width:100%;padding:13px 14px;border:1px solid #dbe2ea;border-radius:12px;font-size:15px;background:#fff}textarea{min-height:100px;resize:vertical}
button{border:0;border-radius:12px;padding:11px 14px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.ghost{background:#eff6ff;color:#2563eb}
header{height:62px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 22px;box-shadow:0 2px 10px #00000010;position:sticky;top:0;z-index:3}.brand{font-weight:800}.brand span{font-weight:400;color:#64748b}
.layout{display:flex;min-height:calc(100vh - 62px)}aside{width:210px;background:#fff;padding:14px;display:grid;align-content:start;gap:8px;border-right:1px solid #e5e7eb}aside button{text-align:left;background:transparent;color:#334155}aside button:hover{background:#eff6ff;color:#2563eb}
main{width:100%;max-width:1050px;padding:25px;margin:auto}.page{display:none}.page.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.item,.student-item,#resultTable{background:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 24px #0000000c}.card b{font-size:30px;color:#2563eb;display:block}.card span{color:#64748b}
.title-row,.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.item{margin-top:12px}.item h3{margin:0 0 8px}.item p{color:#64748b}.item-actions{display:flex;gap:8px}.danger{background:#dc2626}.student-item{margin:10px 0;display:flex;gap:10px;align-items:center}
.modal{position:fixed;inset:0;background:#0007;z-index:10;padding:20px;overflow:auto}.modal-box{background:#fff;border-radius:20px;padding:20px;width:min(650px,100%);margin:30px auto;position:relative}.close{position:absolute;right:12px;top:12px;background:#f1f5f9;color:#334155;padding:6px 10px;font-size:20px}
table{width:100%;border-collapse:collapse;margin-top:14px;background:#fff;border-radius:14px;overflow:hidden}th,td{padding:11px;text-align:left;border-bottom:1px solid #eee;font-size:13px}th{background:#eff6ff}
small{color:#dc2626}@media(max-width:700px){aside{position:fixed;bottom:0;left:0;width:100%;height:62px;display:flex;overflow:auto;z-index:5;padding:7px}aside button{white-space:nowrap;font-size:12px}main{padding:16px;padding-bottom:85px}.cards{grid-template-columns:repeat(2,1fr)}header{padding:0 14px}.brand span{display:none}.layout{display:block}}
</style>
