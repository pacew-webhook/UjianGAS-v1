<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Style'); ?>
</head>

<body>

<div id="loginView" class="login">
  <div class="login-card">

    <div class="logo">🎓</div>
    <h1>Ujian GAS</h1>
    <p>Portal Admin Guru</p>

    <form id="loginForm">
      <input type="email" name="email"
             placeholder="Email Guru" required>

      <input type="password" name="password"
             placeholder="Password" required>

      <button type="submit">Masuk</button>
    </form>

    <p id="loginMsg"></p>

  </div>
</div>


<div id="appView" hidden>

  <header>
    <b>🎓 Ujian GAS</b>

    <div>
      <span id="adminName"></span>
      <button onclick="logout()">Keluar</button>
    </div>
  </header>


  <main>

    <h1>Dashboard</h1>

    <div class="cards">

      <div class="card">
        <b id="studentsCount">0</b>
        <span>Siswa</span>
      </div>

      <div class="card">
        <b id="examsCount">0</b>
        <span>Ujian</span>
      </div>

      <div class="card">
        <b id="questionsCount">0</b>
        <span>Soal</span>
      </div>

      <div class="card">
        <b id="resultsCount">0</b>
        <span>Hasil</span>
      </div>

    </div>

  </main>

</div>


<script>

let TOKEN = '';
let ADMIN = null;

const $ = id => document.getElementById(id);


/* PANGGIL APPS SCRIPT */

function call(fn, ...args) {

  return new Promise((resolve, reject) => {

    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(error => {

        reject(
          new Error(
            error.message || String(error)
          )
        );

      })[fn](...args);

  });

}


/* LOGIN */

$('loginForm').onsubmit = async e => {

  e.preventDefault();

  const form = e.target;

  const email =
    form.email.value.trim();

  const password =
    form.password.value;

  const msg =
    $('loginMsg');

  try {

    msg.textContent =
      'Memproses...';

    const result =
      await call(
        'loginAdmin',
        email,
        password
      );


    if (
      !result ||
      !result.token ||
      !result.admin
    ) {
      throw new Error(
        'Email atau password salah'
      );
    }


    TOKEN =
      result.token;

    ADMIN =
      result.admin;


    sessionStorage.setItem(
      'ugas_token',
      TOKEN
    );

    sessionStorage.setItem(
      'ugas_admin',
      JSON.stringify(ADMIN)
    );


    startApp();


  } catch (error) {

    TOKEN = '';
    ADMIN = null;

    sessionStorage.clear();

    msg.textContent =
      error.message ||
      'Login gagal';

  }

};


/* MASUK APP */

function startApp() {

  $('loginView').hidden = true;

  $('appView').hidden = false;

  $('adminName').textContent =
    ADMIN.Nama || 'Guru';

  dashboard();

}


/* DASHBOARD */

async function dashboard() {

  try {

    const data =
      await call(
        'getDashboard',
        TOKEN
      );


    $('studentsCount').textContent =
      data.students || 0;

    $('examsCount').textContent =
      data.exams || 0;

    $('questionsCount').textContent =
      data.questions || 0;

    $('resultsCount').textContent =
      data.results || 0;


  } catch (error) {

    console.log(error);

  }

}


/* LOGOUT */

async function logout() {

  try {

    if (TOKEN) {

      await call(
        'logoutAdmin',
        TOKEN
      );

    }

  } catch (error) {}


  TOKEN = '';
  ADMIN = null;

  sessionStorage.clear();

  $('appView').hidden = true;

  $('loginView').hidden = false;

}


/* RESTORE LOGIN */

(async function() {

  try {

    TOKEN =
      sessionStorage.getItem(
        'ugas_token'
      ) || '';

    const admin =
      sessionStorage.getItem(
        'ugas_admin'
      );

    if (!TOKEN || !admin) return;

    ADMIN =
      JSON.parse(admin);

    await call(
      'getDashboard',
      TOKEN
    );

    startApp();


  } catch (error) {

    TOKEN = '';
    ADMIN = null;

    sessionStorage.clear();

  }

})();

</script>

</body>
</html>
